name: Bug report
description: Something does not work, crashes, or gives a wrong answer
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Include the preset and relevant server or engine log lines. Remove API keys and private request data before posting.
  - type: textarea
    id: happened
    attributes:
      label: What happened
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Tintero version
      description: The release tag or Git commit you ran.
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: Ubuntu 24.04, Windows 11, ...
    validations:
      required: true
  - type: input
    id: gpus
    attributes:
      label: GPU model(s) and VRAM
      placeholder: 2x RTX 3090 24 GB
    validations:
      required: true
  - type: input
    id: cpu_ram
    attributes:
      label: CPU and RAM
      placeholder: Ryzen 9 7950X, 96 GB
    validations:
      required: true
  - type: input
    id: driver
    attributes:
      label: NVIDIA driver or ROCm version
    validations:
      required: true
  - type: input
    id: model
    attributes:
      label: Model and quant
      placeholder: Inkling-2-Mini, IQ4_NL
    validations:
      required: true
  - type: input
    id: context
    attributes:
      label: Context length
  - type: textarea
    id: command
    attributes:
      label: The command or config you used
      description: Include the preset path and any settings you changed.
      render: shell
  - type: textarea
    id: log
    attributes:
      label: Log
      description: Paste the relevant startup and error lines.
      render: text
