name: Speed report
description: Share Tintero benchmark results
labels: ["speed-report"]
body:
  - type: markdown
    attributes:
      value: |
        Follow the [benchmark guide](https://github.com/GodGMN/tintero/blob/main/docs/BENCHMARK.md) to generate a Markdown table.
  - type: textarea
    id: results
    attributes:
      label: Benchmark table
      description: Paste the contents of speed-report.md.
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Benchmark command
      description: Include the benchmark environment and token IDs if you used a different token file. Remove API keys from commands and logs.
      render: shell
    validations:
      required: true
  - type: textarea
    id: system
    attributes:
      label: System and driver
      placeholder: Ubuntu 24.04, NVIDIA driver 580, CUDA 13, Ryzen 5 5600, 64 GB RAM
    validations:
      required: true
