name: Speed report
description: Share how fast Tintero runs on your PC
labels: ["speed-report"]
body:
  - type: markdown
    attributes:
      value: |
        Include the benchmark command, the preset and the measured rates. Remove API keys from any command or log you share.
  - type: input
    id: gpus
    attributes:
      label: GPUs, how many, and VRAM
      placeholder: 2x RTX 3090 24 GB
    validations:
      required: true
  - type: input
    id: cpu
    attributes:
      label: CPU
    validations:
      required: true
  - type: input
    id: ram
    attributes:
      label: RAM
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
    validations:
      required: true
  - type: input
    id: model
    attributes:
      label: Model and quant
      placeholder: Inkling-2-Mini, IQ4_NL
    validations:
      required: true
  - type: input
    id: context
    attributes:
      label: Context length
  - type: input
    id: prompt
    attributes:
      label: Prompt length (tokens)
  - type: input
    id: prefill
    attributes:
      label: Prefill (reading the prompt), tokens/s
    validations:
      required: true
  - type: input
    id: decode
    attributes:
      label: Decode (writing the answer), tokens/s
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Tintero version
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: The command or config you used
      render: shell
  - type: textarea
    id: report
    attributes:
      label: Benchmark output
      description: Attach the output or paste the measured results.
