name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python packages
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/python" -m pip install --quiet gguf numpy pillow requests jinja2 regex pyyaml tqdm psutil 'jsonschema>=4.18,<5'
      - name: The AMD build's CUDA names all mapped (include/strata/hip_compat)
        run: '"$RUNNER_TEMP/venv/bin/python" tools/check_hip_compat.py'
      - name: Configure without a GPU SDK
        run: cmake -S . -B build-check -DSTRATA_ENABLE_CUDA=OFF -DSTRATA_ENABLE_HIP=OFF
      - name: Server tests
        run: '"$RUNNER_TEMP/venv/bin/python" -m unittest discover -s serve -p "test_*.py" -t .'
      - name: Tools tests
        run: '"$RUNNER_TEMP/venv/bin/python" -m unittest discover -s tools -p "test_*.py"'
      - name: Decode comparison
        run: '"$RUNNER_TEMP/venv/bin/python" tests/ik2_compare_decode_test.py'
