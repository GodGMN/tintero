name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python packages
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/python" -m pip install --quiet -r docker/requirements.txt
      - name: The AMD build's CUDA names all mapped (include/strata/hip_compat)
        run: '"$RUNNER_TEMP/venv/bin/python" tools/check_hip_compat.py'
      - name: Configure without a GPU SDK
        run: cmake -S . -B build-check -DSTRATA_ENABLE_CUDA=OFF -DSTRATA_ENABLE_HIP=OFF
      - name: Server tests
        run: '"$RUNNER_TEMP/venv/bin/python" -m unittest discover -s serve -p "test_*.py" -t .'
      - name: Tools tests
        run: |
          "$RUNNER_TEMP/venv/bin/python" -m unittest \
            tools.test_ablate_fit tools.test_hip_compat tools.test_ik2_ablate_packaging \
            tools.test_maya_names tools.test_strata_tokenizer tools.test_tintero_settings \
            tools.test_tokenizer_glm tools.test_tokenizer_inkling
      - name: Docker startup and Compose profiles
        run: |
          "$RUNNER_TEMP/venv/bin/python" tests/docker_startup_test.py
          docker compose --profile cuda config --quiet
          docker compose --profile hip config --quiet
      - name: Decode comparison
        run: '"$RUNNER_TEMP/venv/bin/python" tests/ik2_compare_decode_test.py'
