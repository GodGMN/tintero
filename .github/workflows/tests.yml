name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # a venv, as installs run: maya.py started from a system Python hands itself to ./maya.sh (os.execve)
      - name: Python packages
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/python" -m pip install --quiet gguf numpy pillow requests jinja2 regex pyyaml tqdm psutil 'jsonschema>=4.18,<5'
      - name: The AMD build's CUDA names all mapped (include/strata/hip_compat)
        run: '"$RUNNER_TEMP/venv/bin/python" tools/check_hip_compat.py'
      - name: Configure without a GPU SDK
        run: cmake -S . -B build-check -DSTRATA_ENABLE_CUDA=OFF -DSTRATA_ENABLE_HIP=OFF
      - name: Server tests
        run: '"$RUNNER_TEMP/venv/bin/python" -m unittest discover -s serve -p "test_*.py" -t .'
      - name: Tools tests
        run: '"$RUNNER_TEMP/venv/bin/python" -m unittest discover -s tools -p "test_*.py"'
      - name: Decode comparison and web client tests
        run: |
          "$RUNNER_TEMP/venv/bin/python" tests/ik2_compare_decode_test.py
          node --test tools/test_*.mjs

  windows-msvc:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Configure without a GPU SDK and run Windows MSVC host tests
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VSINSTALL=%%i"
          call "%VSINSTALL%\VC\Auxiliary\Build\vcvars64.bat" || exit /b 1
          cmake -S . -B build-check -G Ninja -DSTRATA_ENABLE_CUDA=OFF -DSTRATA_ENABLE_HIP=OFF || exit /b 1
          cl /nologo /std:c++20 /EHsc /O2 /W3 /Isrc\ik2 tests\ik2_served_policy_test.cpp /Fe:ik2_served_policy_test.exe || exit /b 1
          ik2_served_policy_test.exe || exit /b 1
          cl /nologo /std:c++20 /EHsc /O2 /W3 /Isrc\ik2 tests\ik2_host_store_test.cpp /Fe:ik2_host_store_test.exe || exit /b 1
          ik2_host_store_test.exe || exit /b 1
          cl /nologo /std:c++20 /EHsc /O2 /W3 /openmp /arch:AVX2 /fp:precise /Isrc\ik2 /c src\ik2\ik2_cpu_deep.cpp || exit /b 1
          cl /nologo /std:c++20 /EHsc /O2 /W3 /Isrc\ik2 /c src\ik2\ik2_cpu.cpp || exit /b 1
