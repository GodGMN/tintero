name: inkling-2-mini
services:
  llama:
    image: hyperion/tintero:gfx1100-service-r6
    container_name: inkling-2-mini
    restart: unless-stopped
    mem_limit: 10g
    memswap_limit: 10g
    healthcheck:
      start_period: 900s
    devices:
      - /dev/dri:/dev/dri
      - /dev/kfd:/dev/kfd
    environment:
      IK2_CACHE_SLOTS: "${IK2_CACHE_SLOTS:-1}"
      IK2_TEXT_ONLY: "${IK2_TEXT_ONLY:-0}"
      IK2_ABLATE_MODE: "${IK2_ABLATE_MODE:-off}"
      # The published gfx1100 image reads this key.
      MAYA_IK2_PRESET: "${TINTERO_IK2_PRESET-${MAYA_IK2_PRESET:-}}"
    volumes:
      - "${INKLING_MODEL_DIR:-../../models/inkling-2-mini}:/opt/maya/models:ro"
    ports:
      - "8085:8080"
